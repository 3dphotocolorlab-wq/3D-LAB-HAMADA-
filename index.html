<body>
<div id="app" class="app-shell"></div>
<div id="toast" class="toast hidden" role="status"></div>
<div id="modal-root"></div>
<script>
(() => {
  const STORAGE_KEY = 'al-anwar-accounting-v1';
  const CLOUD_URL_KEY = 'al-anwar-cloud-url-v1';
  const defaultMeasures = [
    {size:'15×10', price:3}, {size:'18×13', price:5}, {size:'21×15', price:8}, {size:'30×20', price:18}
  ];
  const nowISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const seed = () => ({
    settings:{studioName:'3D LAB',currency:'ج.م',nextInvoice:8,adminName:'المدير'},
    clients:[
      {id:1,name:'استوديو النور',phone:'01012345678',openingBalance:1780,notes:'',measures:defaultMeasures.map(x=>({...x}))},
      {id:2,name:'محمد عبد الرحمن',phone:'01122334455',openingBalance:260,notes:'',measures:defaultMeasures.map(x=>({...x}))},
      {id:3,name:'فوتو سيتي',phone:'01255667788',openingBalance:270,notes:'',measures:defaultMeasures.map(x=>({...x}))},
      {id:4,name:'مكتبة الأمل',phone:'01533221100',openingBalance:0,notes:'',measures:defaultMeasures.map(x=>({...x}))},
      {id:5,name:'سارة إبراهيم',phone:'01099887766',openingBalance:330,notes:'',measures:defaultMeasures.map(x=>({...x}))}
    ], invoices:[], payments:[], updatedAt: 0
  });

  let db;
  try { const saved = localStorage.getItem(STORAGE_KEY); db = saved ? JSON.parse(saved) : seed(); } catch { db = seed(); }
  if (!db || !Array.isArray(db.clients) || !Array.isArray(db.invoices)) db = seed();
  db.settings ||= {studioName:'3D LAB',currency:'ج.م',nextInvoice:8,adminName:'المدير'};
  db.payments ||= [];
  db.updatedAt ||= 0;

  // دعم قراءة رابط السحابة من الرابط المباشر (?api=...) أو من الذاكرة المحلية
  const urlParams = new URLSearchParams(window.location.search);
  const paramApi = urlParams.get('api');
  if (paramApi && paramApi.startsWith('https://')) {
    localStorage.setItem(CLOUD_URL_KEY, paramApi.trim());
  }
  let cloudUrl = localStorage.getItem(CLOUD_URL_KEY) || '';
  let syncStatus = cloudUrl ? 'syncing' : 'local'; // local | syncing | synced | error

  let page = 'invoice';
  let activeClientId = db.clients[0]?.id ?? null;
  let editingClientId = activeClientId;
  let customerSearch = '';
  let invoiceSearch = '';
  let paymentSearch = '';
  let selectedInvoiceClientId = '';
  let invoiceDate = nowISO();
  let invoiceNumber = Number(db.settings.nextInvoice || 8);
  let discountValue = 0;
  let paidValue = 0;
  let draftLines = [];
  let statementClientId = db.clients[0]?.id ?? '';
  let quickSearch = '';
  let quickResultsOpen = false;
  let invoiceDateFilter = '';
  let paymentDateFilter = '';
  let toastTimer;

  const app = document.getElementById('app');
  const modalRoot = document.getElementById('modal-root');
  const toastEl = document.getElementById('toast');
  const fmt = n => Number(n || 0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => `${fmt(n)} ${db.settings.currency || 'ج.م'}`;
  const dateLabel = (date, options={}) => { if(!date)return '—'; const d = new Date(`${date}T12:00:00`); try{return d.toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric',...options});}catch{return date;} };
  const todayLabel = () => { const d=new Date(); return `${d.toLocaleDateString('ar-EG',{weekday:'long'})}، ${d.toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'})}`; };
  const toast = (msg, error=false) => { toastEl.textContent=msg; toastEl.classList.toggle('error',error); toastEl.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.add('hidden'),3200); };

  // المزامنة السحابية مع Google Drive عبر Apps Script
  async function pushToCloud() {
    if (!cloudUrl) return;
    syncStatus = 'syncing';
    updateSyncBadge();
    try {
      const res = await fetch(cloudUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(db)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      syncStatus = 'synced';
    } catch (e) {
      console.warn('Cloud push failed:', e);
      syncStatus = 'error';
    }
    updateSyncBadge();
  }

  async function pullFromCloud(silent = false) {
    if (!cloudUrl) {
      if (!silent) toast('يرجى إدخال رابط المزامنة السحابية في الإعدادات أولاً.', true);
      return;
    }
    syncStatus = 'syncing';
    updateSyncBadge();
    try {
      const res = await fetch(cloudUrl + (cloudUrl.includes('?') ? '&' : '?') + 't=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const remote = await res.json();
      if (remote && Array.isArray(remote.clients) && Array.isArray(remote.invoices)) {
        remote.payments ||= [];
        remote.settings ||= db.settings;
        remote.updatedAt ||= 0;
        if (remote.updatedAt > (db.updatedAt || 0) || !silent) {
          db = remote;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
          activeClientId = db.clients[0]?.id ?? null;
          editingClientId = activeClientId;
          statementClientId = activeClientId ?? '';
          invoiceNumber = Number(db.settings.nextInvoice || 8);
          renderShell();
          if (!silent) toast('تم تحديث البيانات من Google Drive بنجاح.');
        }
      } else if (remote === null) {
        // أول مرة: رفع البيانات الحالية للسحابة لإنشاء الملف
        await pushToCloud();
      }
      syncStatus = 'synced';
    } catch (e) {
      console.warn('Cloud pull failed:', e);
      syncStatus = 'error';
      if (!silent) toast('تعذر الاتصال بالسحابة. تأكد من الإنترنت ورابط السكريبت.', true);
    }
    updateSyncBadge();
  }

  function updateSyncBadge() {
    const el = document.getElementById('sync-indicator');
    if (!el) return;
    if (!cloudUrl) {
      el.innerHTML = `<span class="status-dot offline"></span>تخزين محلي فقط`;
    } else if (syncStatus === 'syncing') {
      el.innerHTML = `<span class="status-dot syncing"></span>جاري المزامنة...`;
    } else if (syncStatus === 'synced') {
      el.innerHTML = `<span class="status-dot"></span>متصل بجوجل درايف`;
    } else {
      el.innerHTML = `<span class="status-dot offline"></span>خطأ في المزامنة`;
    }
  }

  const saveDB = () => {
    db.updatedAt = Date.now();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch(e) { console.warn(e); }
    if (cloudUrl) pushToCloud();
  };

  const getClient = id => db.clients.find(c => String(c.id) === String(id));
  const clientBalance = id => {
    const c = getClient(id); if(!c) return 0;
    const invs = db.invoices.filter(i=>String(i.clientId)===String(id)).reduce((s,i)=>s+Number(i.total||0)-Number(i.paid||0),0);
    const pays = db.payments.filter(p=>String(p.clientId)===String(id)).reduce((s,p)=>s+Number(p.amount||0),0);
    return Number(c.openingBalance||0)+invs-pays;
  };
  const totalSales = () => db.invoices.reduce((s,i)=>s+Number(i.total||0),0);
  const totalCollected = () => db.invoices.reduce((s,i)=>s+Number(i.paid||0),0)+db.payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalDebts = () => db.clients.reduce((s,c)=>s+Math.max(0,clientBalance(c.id)),0);
  const totalItems = () => db.invoices.reduce((s,i)=>s+(i.lines||[]).reduce((a,l)=>a+Number(l.qty||0),0),0);

  const navs = [
    ['dashboard','⌂','الرئيسية'],['invoice','▧','فاتورة جديدة'],['clients','♙','العملاء'],['payments','▣','الدفعات'],['statement','▤','كشف حساب'],['invoices','☷','الفواتير السابقة'],['reports','▥','التقارير'],['settings','⚙','الإعدادات']
  ];
  function renderShell() {
    app.innerHTML = `
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">▣</div><div class="brand-title"><strong>${esc(db.settings.studioName || '3D LAB')}</strong><small>برنامج الفواتير السحابي</small></div></div>
        <nav class="nav">${navs.map(([key,icon,label])=>`<button class="nav-btn ${page===key?'active':''}" data-page="${key}"><span class="nav-icon">${icon}</span><span>${label}</span></button>`).join('')}</nav>
        <div class="sidebar-bottom" id="sync-indicator"></div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="page-heading">${esc(pageTitle())}</div>
          <div class="top-search"><input id="quick-search" value="${esc(quickSearch)}" placeholder="بحث سريع: عميل أو رقم فاتورة (Ctrl+F)" autocomplete="off"><span class="search-glyph">⌕</span><div id="quick-results" class="quick-search-results ${quickResultsOpen?'':'hidden'}"></div></div>
          <div class="top-actions">
            <button class="sync-pill" data-action="sync-now" title="تحديث البيانات الآن من Google Drive">↻ مزامنة</button>
            <button class="icon-btn" data-action="toggle-theme" title="تغيير المظهر">☾</button>
            <div class="admin"><div class="admin-info"><strong>${esc(db.settings.adminName||'المدير')}</strong><small>مدير</small></div><div class="admin-dot">م</div></div>
            <div class="date-info">${todayLabel()}</div>
          </div>
        </header>
        <section class="content" id="page-content">${renderPage()}</section>
      </main>`;
    updateSyncBadge();
    if (document.body.classList.contains('dark')) document.body.classList.add('dark');
    if (quickResultsOpen) renderQuickResults();
  }
  function pageTitle() { return ({dashboard:'الرئيسية',invoice:'فاتورة جديدة',clients:'العملاء',payments:'الدفعات',statement:'كشف حساب',invoices:'الفواتير السابقة',reports:'التقارير',settings:'الإعدادات وربط السحابة'})[page] || 'برنامج الحسابات'; }
  function renderPage() {
    switch(page){case 'invoice':return renderInvoice();case 'clients':return renderClients();case 'payments':return renderPayments();case 'statement':return renderStatement();case 'invoices':return renderInvoices();case 'reports':return renderReports();case 'settings':return renderSettings();default:return renderDashboard();}
  }
  function renderInvoice() {
    const client=getClient(selectedInvoiceClientId);
    const previous=client?clientBalance(client.id):0;
    const lineList = client ? (draftLines.length ? draftLines : client.measures.map((m,i)=>({id:i+1,size:m.size,price:Number(m.price)||0,qty:0}))) : [];
    draftLines=lineList;
    const raw=lineList.reduce((s,l)=>s+(Number(l.price)||0)*(Number(l.qty)||0),0);
    const discount=Math.max(0,Number(discountValue)||0);
    const invTotal=Math.max(0,raw-discount);
    const paid=Math.max(0,Number(paidValue)||0);
    const due=previous+invTotal;
    const remain=due-paid;
    return `<div class="invoice-layout">
      <div class="invoice-main">
        <div class="card pad"><div class="invoice-meta">
          <div class="field customer-field"><label>العميل</label><select id="invoice-client"><option value="">اختر العميل</option>${db.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(c=>`<option value="${c.id}" ${String(c.id)===String(selectedInvoiceClientId)?'selected':''}>${esc(c.name)} — ${esc(c.phone)}</option>`).join('')}</select></div>
          <div class="field"><label>رقم الفاتورة</label><input id="invoice-number" type="number" min="1" value="${esc(invoiceNumber)}"></div>
          <div class="field"><label>التاريخ</label><input id="invoice-date" type="date" value="${esc(invoiceDate)}"></div>
